name: Project CI & Structure Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify repository structure
        run: |
          test -f README.md && test -f .gitignore && test -d docs && test -d src && test -d tests

      - name: Run automated checks
        run: echo "Structure and CI checks passed successfully!"
